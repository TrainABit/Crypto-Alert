name: ios

on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Newest installed release of each major version: what developers run today and the next one.
        xcode_major: ["16", "26"]
    name: build (Xcode ${{ matrix.xcode_major }})
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          app="$(ls -d /Applications/Xcode_${{ matrix.xcode_major }}*.app | sort -V | tail -1)"
          test -n "$app" || { echo "no Xcode ${{ matrix.xcode_major }} on this runner"; exit 1; }
          sudo xcode-select -s "$app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -quiet -project CryptoAlert.xcodeproj -scheme CryptoAlert \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-xcode-${{ matrix.xcode_major }}
          path: ios/xcodebuild.log
          if-no-files-found: ignore
