name: ios

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode app to build with, e.g. Xcode_16.4.app (default: newest on the runner)"
        required: false
        default: ""
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -n "${{ github.event.inputs.xcode }}" ]; then
            sudo xcode-select -s "/Applications/${{ github.event.inputs.xcode }}"
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -quiet -project CryptoAlert.xcodeproj -scheme CryptoAlert \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
